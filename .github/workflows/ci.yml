name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        working-directory: server
        run: npm install
      - name: Run API tests
        working-directory: server
        env:
          DATA_MODE: demo
          JWT_SECRET: test-ci-jwt-secret-must-be-at-least-32-chars-long!
          DEMO_ADMIN_EMAIL: admin@careroute.local
          DEMO_ADMIN_PASSWORD: TestCiAdminPassword123!
        run: npm test
      - name: Install frontend dependencies
        working-directory: client
        run: npm install
      - name: Run frontend tests
        working-directory: client
        run: npm test
      - name: Build frontend
        working-directory: client
        run: npm run build
